name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    uses: so1ve/workflows/.github/workflows/rust-ci.yml@v1
    with:
      toolchain: nightly
      runs-on: macos-latest
      runs-on-matrix: '"windows-latest","macos-latest"'
      test-command: >-
        cargo test --all &&
        cargo test --manifest-path tests/compat/gpui-main/Cargo.toml --target-dir target &&
        cargo test --manifest-path tests/compat/gpui-unofficial/Cargo.toml --target-dir target &&
        cargo test --manifest-path tests/compat/gpui-kit/Cargo.toml --target-dir target
