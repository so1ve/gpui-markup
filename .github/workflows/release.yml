name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release-pr:
    name: Prepare release
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    uses: so1ve/workflows/.github/workflows/rust-release.yml@v1
    with:
      toolchain: nightly
      command: release-pr

  release:
    name: Publish release
    uses: so1ve/workflows/.github/workflows/rust-release.yml@v1
    with:
      toolchain: nightly
      command: release
